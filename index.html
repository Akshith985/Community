<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skynet Guild Dashboard</title>
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Press Start 2P', cursive; background-color: #212529; color: #fff; padding: 1.5rem; }
    .tech-tag { display: inline-block; background-color: #e76e55; color: #fff; font-size: 0.5rem; padding: 2px 6px; border-radius: 3px; margin-right: 4px; }
    .project-card { margin-bottom: 1rem; display: flex; flex-direction: column; justify-content: space-between; }
  </style>
</head>
<body>

  <!-- Guest Header -->
  <div id="guest-view" class="nes-container is-dark is-rounded" style="margin-bottom: 1.5rem;">
    <p style="font-size: 0.7rem;">Welcome, Guest! Log in to join missions and earn guild points.</p>
  </div>

  <!-- Authenticated User Stats Dashboard -->
  <div id="dashboard-view" class="nes-container is-dark is-rounded" style="display: none; margin-bottom: 1.5rem; border-color: #f7d51d;">
    <h2 style="font-size: 0.8rem; color: #f7d51d;">Member Status</h2>
    <p style="font-size: 0.6rem; color: #aaa;">Logged as: <span id="dash-user-email" style="color: #fff;"></span></p>
    <div style="display: flex; gap: 1rem; margin-top: 0.8rem;">
      <div class="nes-container is-dark" style="padding: 0.5rem 1rem;">
        <span style="font-size: 0.55rem; color: #aaa;">Total Points:</span>
        <div id="dash-total-points" style="font-size: 0.9rem; color: #92cc41;">0</div>
      </div>
      <div class="nes-container is-dark" style="padding: 0.5rem 1rem;">
        <span style="font-size: 0.55rem; color: #aaa;">Missions Done:</span>
        <div id="dash-completed-count" style="font-size: 0.9rem; color: #209cee;">0</div>
      </div>
    </div>
  </div>

  <!-- Guild Leaderboard Section -->
  <section class="nes-container is-dark with-title" style="margin-bottom: 2rem;">
    <p class="title" style="color: #f7d51d;">Guild Leaderboard</p>
    <div id="leaderboard-list">
      <p style="font-size: 0.6rem; color: #aaa; text-align: center;">Loading rankings...</p>
    </div>
  </section>

  <!-- Completed Projects Log Section -->
  <section class="nes-container is-dark with-title" style="margin-bottom: 2rem;">
    <p class="title" style="color: #92cc41;">Completed Projects Archive</p>
    <div id="done-projects-container">
      <p style="font-size: 0.6rem; color: #aaa; text-align: center;">Loading archived completions...</p>
    </div>
  </section>

  <!-- Available Missions Section -->
  <section class="nes-container is-dark with-title" style="margin-bottom: 2rem;">
    <p class="title" style="color: #209cee;">Active Missions</p>
    <div id="projects-container">
      <p style="font-size: 0.65rem; color: #aaa;">Loading active missions...</p>
    </div>
  </section>

  <!-- Admin / Mission Creation Form -->
  <section class="nes-container is-dark with-title">
    <p class="title">Post New Mission</p>
    <form onsubmit="handleCreateProject(event)">
      <div class="nes-field" style="margin-bottom: 1rem;">
        <label style="font-size: 0.6rem;">Title</label>
        <input type="text" id="proj-title" class="nes-input is-dark" style="font-size: 0.6rem;" required />
      </div>
      <div class="nes-field" style="margin-bottom: 1rem;">
        <label style="font-size: 0.6rem;">Tech Stack (Comma Separated)</label>
        <input type="text" id="proj-tech" class="nes-input is-dark" style="font-size: 0.6rem;" placeholder="React, Supabase, Tailwind" required />
      </div>
      <div class="nes-field" style="margin-bottom: 1rem;">
        <label style="font-size: 0.6rem;">Description</label>
        <textarea id="proj-desc" class="nes-textarea is-dark" style="font-size: 0.6rem;" required></textarea>
      </div>
      <button type="submit" class="nes-btn is-primary" style="font-size: 0.65rem;">Publish Mission</button>
    </form>
  </section>

  <script type="module" src="firebase-config.js"></script>
  <script src="supabase-config.js"></script>
  <script src="skynet-app.js"></script>
</body>
</html>
