<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Quest Not Found</title>
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Press Start 2P', cursive;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .error-card {
      background-color: #fff;
      max-width: 600px;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      color: #e76e55;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.75rem;
      line-height: 1.5rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="nes-container with-title is-centered error-card">
    <p class="title">ERROR 404</p>
    <i class="nes-mario" style="margin-bottom: 1.5rem;"></i>
    <h1>404</h1>
    <p>GAME OVER! The page or quest you are searching for has been moved or destroyed by a dragon.</p>
    <a href="index.html" class="nes-btn is-primary">Return to Spawn</a>
  </div>
</body>
</html>
